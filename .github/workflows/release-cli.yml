name: Release CLI

# CLI binary release run from the PUBLIC `caliptic-org/releases` repo
# so it consumes free unlimited Actions minutes instead of the private
# `caliptic-org/caliptic` repo's paid budget. The source code lives in
# the private repo; we check it out using a fine-grained PAT stored as
# the `PRIVATE_REPO_TOKEN` secret on this (public releases) repo.
#
# Outputs (GitHub Release on caliptic-org/releases, the same place the
# old workflow wrote to) and Homebrew tap update are identical to the
# previous private workflow — only the runner location changes.
#
# Manual trigger:
#   GitHub UI → Actions → Release CLI → "Run workflow" → tag (e.g. v0.1.40)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to release (e.g. v0.1.40). Empty = use latest in source repo."
        required: false
        default: ""
      source_ref:
        description: "Branch/ref in the private repo to build from. Defaults to release."
        required: false
        default: "release"

permissions:
  contents: write   # write the Release on THIS (public) repo

jobs:
  release:
    name: Release CLI (GoReleaser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── 1. Check out the SOURCE code from the private repo ──────
      # PRIVATE_REPO_TOKEN: a fine-grained PAT with `contents: read`
      # on caliptic-org/caliptic, configured as a secret on
      # caliptic-org/releases.
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Derive release version
        id: ver
        run: |
          input_tag="${{ github.event.inputs.tag }}"
          if [ -n "$input_tag" ]; then
            ver="$input_tag"
          else
            ver=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          fi
          echo "tag=$ver" >> "$GITHUB_OUTPUT"
          echo "Using GoReleaser current-tag=$ver"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run Go tests
        run: cd server && go test ./...

      - name: Create the release without making it latest
        # The CLI, desktop and images workflows publish to the same release.
        # Whichever runs first creates it, never as latest; "Mark as latest
        # when complete" flips it once everything is uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Caliptic $TAG" --latest=false \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yml
        env:
          # GITHUB_TOKEN scoped to THIS public releases repo would be
          # enough since .goreleaser.yml targets owner/name=releases.
          # We still pass RELEASES_TOKEN because the homebrew tap step
          # needs to write to caliptic-org/homebrew-tap.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.tag }}

      - name: Mark as latest when complete
        # install.sh and the download page follow /releases/latest, so the
        # release becomes latest only when the installers, the CLI, the
        # desktop apps and the images are all published. The last workflow
        # to finish does it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          need="install.sh install.ps1 docker-compose.selfhost.yml selfhost.env.example
            caliptic-cli-$v-linux-amd64.tar.gz caliptic-cli-$v-darwin-arm64.tar.gz caliptic-cli-$v-windows-amd64.zip
            caliptic-desktop-$v-mac-arm64.dmg caliptic-desktop-$v-windows-x64.exe caliptic-desktop-$v-linux-x86_64.AppImage
            caliptic-local-$v-mac-arm64.dmg caliptic-local-$v-windows-x64.exe caliptic-local-$v-linux-x86_64.AppImage"
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=""
          for f in $need; do
            grep -qxF "$f" <<<"$have" || missing="$missing $f"
          done
          for img in caliptic-backend caliptic-web caliptic-daemon; do
            docker manifest inspect "ghcr.io/$OWNER/$img:$TAG" >/dev/null 2>&1 || missing="$missing $img:$TAG"
          done
          if [ -n "$missing" ]; then
            echo "$TAG is not complete yet; missing:$missing"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          echo "$TAG is complete and is now the latest release"
