name: Release Desktop Apps

# Desktop binary release run from the PUBLIC `caliptic-org/releases`
# repo. macOS Actions minutes cost 10x on private repos; running this
# on a public repo makes them free. Windows + Linux runners also free
# on public.
#
# Source code is checked out from the private `caliptic-org/caliptic`
# repo using PRIVATE_REPO_TOKEN (fine-grained PAT with contents:read).
# electron-builder publishes to GitHub Releases on THIS public repo
# (the same destination the old private workflow used because the
# original `release-desktop.yml` env was `GH_TOKEN: RELEASES_TOKEN`,
# which already targeted the public releases repo).
#
# Builds BOTH editions in a single run:
#   - Normal Desktop (Caliptic) — uses scripts/package.mjs
#   - Local Edition (Caliptic Local) — builds Go binaries + electron-builder-local.yml
# Artifact names don't conflict (caliptic-desktop-* vs caliptic-local-*),
# so all 6 jobs publish to the same GitHub Release.
#
# Manual trigger:
#   GitHub UI → Actions → Release Desktop Apps → "Run workflow"
# Pre-requisite: a semver tag (e.g. v0.1.40) must exist in the source
# repo so electron-builder has something to publish against.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/ref in the private repo to build from. Defaults to release."
        required: false
        default: "release"

permissions:
  contents: write   # write GitHub Releases on THIS public repo

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release without making it latest
        # The CLI, desktop and images workflows publish to the same release.
        # Whichever runs first creates it, never as latest; "Mark as latest
        # when complete" flips it once everything is uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Caliptic $TAG" --latest=false \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  # ── Windows ────────────────────────────────────────────────────────────────
  build-desktop-windows:
    name: Build Desktop (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean stale release manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for MANIFEST in latest.yml latest-arm64.yml; do
            ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq ".[0].assets[] | select(.name==\"$MANIFEST\") | .id" 2>/dev/null || echo "")
            if [ -n "$ASSET_ID" ]; then
              echo "Deleting stale $MANIFEST (asset $ASSET_ID)"
              gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            fi
          done
          sleep 3

      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          pnpm --filter @caliptic/desktop exec node scripts/package.mjs --win --x64 --publish always

  # ── macOS ──────────────────────────────────────────────────────────────────
  # Runs in PARALLEL with Windows (no `needs:` link).
  build-desktop-mac:
    name: Build Desktop (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer certificate
        if: ${{ env.CSC_LINK != '' }}
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CSC_LINK" | base64 --decode -o "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Clean stale release manifests
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="latest-mac.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting stale latest-mac.yml (asset $ASSET_ID)"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 3
          fi

      - name: Build & publish macOS installer (arm64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ -z "$CSC_LINK" ]; then
            pnpm --filter @caliptic/desktop exec node scripts/package.mjs --mac --arm64 --publish always -c.mac.identity=null
          else
            pnpm --filter @caliptic/desktop exec node scripts/package.mjs --mac --arm64 --publish always
          fi

      # electron-builder's overwrite logic (delete + re-upload) races on
      # GitHub's API — the DELETE returns 204 but the asset name stays
      # reserved briefly, causing the next POST to 422. Pre-deleting with
      # a sleep gives the API time to converge before the x64 build uploads
      # a merged manifest covering both arches.
      - name: Pre-delete auto-update manifest (avoid overwrite race)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="latest-mac.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting latest-mac.yml (asset $ASSET_ID) before x64 build"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 5
          fi

      - name: Build & publish macOS installer (x64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ -z "$CSC_LINK" ]; then
            pnpm --filter @caliptic/desktop exec node scripts/package.mjs --mac --x64 --publish always -c.mac.identity=null
          else
            pnpm --filter @caliptic/desktop exec node scripts/package.mjs --mac --x64 --publish always
          fi

  # ── Linux ───────────────────────────────────────────────────────────────────
  # Runs in PARALLEL with Windows and macOS (no `needs:` link).
  # No code signing needed for Linux.
  build-desktop-linux:
    name: Build Desktop (Linux)
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Clean stale release manifests
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for MANIFEST in latest-linux.yml latest-linux-arm64.yml; do
            ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq ".[0].assets[] | select(.name==\"$MANIFEST\") | .id" 2>/dev/null || echo "")
            if [ -n "$ASSET_ID" ]; then
              echo "Deleting stale $MANIFEST (asset $ASSET_ID)"
              gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            fi
          done
          sleep 3

      - name: Build & publish Linux packages (x64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          pnpm --filter @caliptic/desktop exec node scripts/package.mjs --linux --x64 --publish always

      - name: Pre-delete auto-update manifest (avoid overwrite race)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="latest-linux.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting latest-linux.yml (asset $ASSET_ID) before arm64 build"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 5
          fi

      - name: Build & publish Linux packages (arm64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          pnpm --filter @caliptic/desktop exec node scripts/package.mjs --linux --arm64 --publish always

  # ══════════════════════════════════════════════════════════════════════
  # LOCAL EDITION — embedded PostgreSQL + caliptic-server + daemon
  # Artifact names use caliptic-local-* prefix (no conflict with normal).
  # ══════════════════════════════════════════════════════════════════════

  # ── Local Windows ──────────────────────────────────────────────────────
  build-local-windows:
    name: Build Local Edition (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean stale release manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for MANIFEST in local.yml local-arm64.yml; do
            ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq ".[0].assets[] | select(.name==\"$MANIFEST\") | .id" 2>/dev/null || echo "")
            if [ -n "$ASSET_ID" ]; then
              echo "Deleting stale $MANIFEST (asset $ASSET_ID)"
              gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            fi
          done
          sleep 3

      - name: Build Go binaries (caliptic-local + caliptic-server + caliptic CLI)
        shell: bash
        run: |
          cd server
          mkdir -p bin
          go build -o bin/caliptic-local.exe ./cmd/caliptic-local
          go build -o bin/caliptic-server.exe ./cmd/server
          go build -o bin/caliptic.exe ./cmd/caliptic

      - name: Build and publish Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          pnpm --filter @caliptic/desktop exec electron-vite build
          RAW=$(git describe --tags --always)
          VERSION=$(echo "$RAW" | sed 's/^desktop-local-v//; s/^desktop-v//; s/^cli-v//; s/^server-v//; s/^v//')
          echo "Version: $VERSION (from $RAW)"
          pnpm --filter @caliptic/desktop exec electron-builder --win --x64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION"

  # ── Local macOS ────────────────────────────────────────────────────────
  build-local-mac:
    name: Build Local Edition (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer certificate
        if: ${{ env.CSC_LINK != '' }}
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CSC_LINK" | base64 --decode -o "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Derive version
        id: version
        run: |
          RAW=$(git describe --tags --always)
          VERSION=$(echo "$RAW" | sed 's/^desktop-local-v//; s/^desktop-v//; s/^cli-v//; s/^server-v//; s/^v//')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (from $RAW)"

      - name: Clean stale release manifests
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="local-mac.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting stale local-mac.yml (asset $ASSET_ID)"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 3
          fi

      - name: Build Go binaries (arm64)
        run: |
          cd server
          mkdir -p bin
          GOARCH=arm64 go build -o bin/caliptic-local ./cmd/caliptic-local
          GOARCH=arm64 go build -o bin/caliptic-server ./cmd/server
          GOARCH=arm64 go build -o bin/caliptic ./cmd/caliptic

      - name: Build and publish macOS installer (arm64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm --filter @caliptic/desktop exec electron-vite build
          VERSION="${{ steps.version.outputs.value }}"
          if [ -z "$CSC_LINK" ]; then
            pnpm --filter @caliptic/desktop exec electron-builder --mac --arm64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION" -c.mac.identity=null
          else
            pnpm --filter @caliptic/desktop exec electron-builder --mac --arm64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION"
          fi

      - name: Build Go binaries (x64)
        run: |
          cd server
          rm -f bin/caliptic-local bin/caliptic-server bin/caliptic
          GOARCH=amd64 go build -o bin/caliptic-local ./cmd/caliptic-local
          GOARCH=amd64 go build -o bin/caliptic-server ./cmd/server
          GOARCH=amd64 go build -o bin/caliptic ./cmd/caliptic

      - name: Pre-delete auto-update manifest (avoid overwrite race)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="local-mac.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting local-mac.yml (asset $ASSET_ID) before x64 build"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 5
          fi

      - name: Build and publish macOS installer (x64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if [ -z "$CSC_LINK" ]; then
            pnpm --filter @caliptic/desktop exec electron-builder --mac --x64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION" -c.mac.identity=null
          else
            pnpm --filter @caliptic/desktop exec electron-builder --mac --x64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION"
          fi

  # ── Local Linux ────────────────────────────────────────────────────────
  build-local-linux:
    name: Build Local Edition (Linux)
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: caliptic-org/caliptic
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reset working tree
        run: git checkout -- .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Derive version
        id: version
        run: |
          RAW=$(git describe --tags --always)
          VERSION=$(echo "$RAW" | sed 's/^desktop-local-v//; s/^desktop-v//; s/^cli-v//; s/^server-v//; s/^v//')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (from $RAW)"

      - name: Build Go binaries (x64)
        run: |
          cd server
          mkdir -p bin
          GOARCH=amd64 go build -o bin/caliptic-local ./cmd/caliptic-local
          GOARCH=amd64 go build -o bin/caliptic-server ./cmd/server
          GOARCH=amd64 go build -o bin/caliptic ./cmd/caliptic

      - name: Clean stale release manifests
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for MANIFEST in local-linux.yml local-linux-arm64.yml; do
            ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq ".[0].assets[] | select(.name==\"$MANIFEST\") | .id" 2>/dev/null || echo "")
            if [ -n "$ASSET_ID" ]; then
              echo "Deleting stale $MANIFEST (asset $ASSET_ID)"
              gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            fi
          done
          sleep 3

      - name: Build and publish Linux packages (x64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          pnpm --filter @caliptic/desktop exec electron-vite build
          VERSION="${{ steps.version.outputs.value }}"
          pnpm --filter @caliptic/desktop exec electron-builder --linux --x64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION"

      - name: Pre-delete auto-update manifest (avoid overwrite race)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/caliptic-org/releases/releases --jq '.[0].assets[] | select(.name=="local-linux.yml") | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting local-linux.yml (asset $ASSET_ID) before arm64 build"
            gh api -X DELETE "repos/caliptic-org/releases/releases/assets/$ASSET_ID" || true
            sleep 5
          fi

      - name: Build Go binaries (arm64)
        run: |
          cd server
          rm -f bin/caliptic-local bin/caliptic-server bin/caliptic
          GOARCH=arm64 go build -o bin/caliptic-local ./cmd/caliptic-local
          GOARCH=arm64 go build -o bin/caliptic-server ./cmd/server
          GOARCH=arm64 go build -o bin/caliptic ./cmd/caliptic

      - name: Build and publish Linux packages (arm64)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          pnpm --filter @caliptic/desktop exec electron-builder --linux --arm64 --config electron-builder-local.yml --publish always "-c.extraMetadata.version=$VERSION"

  mark-latest:
    name: Mark as latest when complete
    needs: [build-desktop-windows, build-desktop-mac, build-desktop-linux, build-local-windows, build-local-mac, build-local-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark as latest when complete
        # install.sh and the download page follow /releases/latest, so the
        # release becomes latest only when the installers, the CLI, the
        # desktop apps and the images are all published. The last workflow
        # to finish does it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          need="install.sh install.ps1 docker-compose.selfhost.yml selfhost.env.example
            caliptic-cli-$v-linux-amd64.tar.gz caliptic-cli-$v-darwin-arm64.tar.gz caliptic-cli-$v-windows-amd64.zip
            caliptic-desktop-$v-mac-arm64.dmg caliptic-desktop-$v-windows-x64.exe caliptic-desktop-$v-linux-x86_64.AppImage
            caliptic-local-$v-mac-arm64.dmg caliptic-local-$v-windows-x64.exe caliptic-local-$v-linux-x86_64.AppImage"
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=""
          for f in $need; do
            grep -qxF "$f" <<<"$have" || missing="$missing $f"
          done
          for img in caliptic-backend caliptic-web caliptic-daemon; do
            docker manifest inspect "ghcr.io/$OWNER/$img:$TAG" >/dev/null 2>&1 || missing="$missing $img:$TAG"
          done
          if [ -n "$missing" ]; then
            echo "$TAG is not complete yet; missing:$missing"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          echo "$TAG is complete and is now the latest release"
